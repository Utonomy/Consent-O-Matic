<!doctype html>
<html dir="ltr" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="ui.css" />
    <style>
      .popup {
        min-width: 300px;
        padding: 16px;
        font-family: system-ui, sans-serif;
      }
      .auth-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        text-align: center;
      }
      .auth-container img {
        width: 64px;
        height: 64px;
      }
      .user-info {
        font-size: 14px;
        color: #333;
      }
      .user-info strong {
        display: block;
        font-size: 16px;
        margin-bottom: 4px;
      }
      .btn {
        display: inline-block;
        padding: 8px 24px;
        border: none;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.15s;
      }
      .btn-login {
        background: #4a90d9;
        color: white;
      }
      .btn-login:hover {
        background: #357abd;
      }
      .btn-logout {
        background: #e0e0e0;
        color: #333;
      }
      .btn-logout:hover {
        background: #ccc;
      }
      .btn-settings {
        background: none;
        border: none;
        color: #666;
        font-size: 12px;
        cursor: pointer;
        text-decoration: underline;
      }
      .hidden {
        display: none !important;
      }
    </style>
  </head>

  <body class="popup">
    <div class="auth-container" id="loading">
      <img src="logo.svg" />
      <div>Loading...</div>
    </div>

    <div class="auth-container hidden" id="logged-out">
      <img src="logo.svg" />
      <h2>Consent-O-Matic</h2>
      <p style="font-size: 13px; color: #666; margin: 0">
        Sign in with your Upod account
      </p>
      <button class="btn btn-login" id="login-btn">Login with Upod</button>
      <button class="btn-settings" id="settings-btn-out">
        Extension Settings
      </button>
    </div>

    <div class="auth-container hidden" id="logged-in">
      <img src="logo.svg" />
      <div class="user-info">
        <strong id="user-name"></strong>
        <span id="user-email"></span>
      </div>
      <button class="btn btn-logout" id="logout-btn">Logout</button>
      <button class="btn-settings" id="settings-btn-in">
        Extension Settings
      </button>
    </div>

    <script src="ui.js"></script>
  </body>
</html>
